<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#090d0f">
  <meta name="description" content="Vitrine de aparelhos disponíveis na loja.">
  <title>Vitrine de aparelhos</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/v/page.css">
</head>
<body>
  <header class="topbar"><a href="/" aria-label="Assistência Simplificada"><img src="/favicon.svg" alt=""><span id="store-name">Vitrine da loja</span></a><button id="share" type="button">Compartilhar</button></header>
  <main>
    <section class="hero"><div><p>CATÁLOGO DIGITAL</p><h1>Seu próximo aparelho está aqui.</h1><span>Estoque atualizado pela loja, com informações simples e atendimento direto.</span></div><div class="hero-mark" aria-hidden="true"><span></span><i>AS</i></div></section>
    <section class="summary" aria-label="Resumo da vitrine"><article><small>Disponíveis agora</small><strong id="total-items">—</strong></article><article><small>Aparelhos novos</small><strong id="new-items">—</strong></article><article><small>Seminovos</small><strong id="used-items">—</strong></article></section>
    <section class="toolbar" aria-label="Filtros"><label><span class="sr-only">Buscar</span><input id="search" maxlength="80" placeholder="Buscar modelo, marca, memória..."></label><select id="kind"><option value="">Novos e usados</option><option>Novo</option><option>Usado</option></select><select id="sort"><option value="featured">Mais relevantes</option><option value="lowest">Menor preço</option><option value="highest">Maior preço</option><option value="recent">Mais recentes</option></select></section>
    <p id="status" class="status">Carregando vitrine...</p>
    <section id="catalog" class="grid" aria-live="polite"></section>
    <section id="detail" class="detail" hidden></section>
  </main>
  <footer>Informações e disponibilidade confirmadas diretamente com a loja.</footer>
  <script src="/v/page.js" defer></script>
</body>
</html>
